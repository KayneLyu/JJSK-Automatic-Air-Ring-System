[package]
name = "air-ring-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
rayon = "1.12.0"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
